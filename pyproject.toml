[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docdiff"
version = "0.2.0"
description = "Office-CLI 时代缺失的那条 diff 命令——结构感知的 .docx 对比工具"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kiki" }]
keywords = ["docx", "diff", "word", "cli", "lcs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
]
# 运行时零依赖:解析/对齐/渲染全部标准库实现
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
docdiff = "docdiff.cli:main"

[tool.setuptools.packages.find]
include = ["docdiff*"]
exclude = ["samples*", "docs*", "experiments*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 一次性实验脚本:内嵌的 OOXML 模板/数据行超长,为行长去重构不值得
"experiments/*" = ["E501"]
# sys.path 引导必须写在 matplotlib 之前,import 排序规则在此不适用
"experiments/gen_term_png.py" = ["E501", "I001"]

[tool.mypy]
strict = true

# tests 只跑不标注类型;experiments 是一次性脚本(依赖 matplotlib/PIL),不参与类型检查
[[tool.mypy.overrides]]
module = ["tests.*"]
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["experiments.*"]
ignore_errors = true
